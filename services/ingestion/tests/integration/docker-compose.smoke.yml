services:
  broker:
    image: confluentinc/confluent-local:7.5.0
    ports:
      - "19092:9092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 5s
      retries: 6

  kafka-init:
    image: confluentinc/confluent-local:7.5.0
    depends_on:
      broker:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic transport-telemetry-raw --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic transport-telemetry-dlq --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic trip.lifecycle --partitions 1 --replication-factor 1

  mqtt-broker:
    image: eclipse-mosquitto:2
    ports:
      - "18884:1883"
    volumes:
      - ../../../../docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 6

  ingestion-service:
    build:
      context: ../../../../
      dockerfile: services/ingestion/Dockerfile
    ports:
      - "18001:8001"
    environment:
      MQTT_BROKER_HOST: mqtt-broker
      MQTT_BROKER_PORT: 1883
      MQTT_TOPIC_PATTERN: transport/bus/+/location
      KAFKA_BROKER_URL: broker:29092
      INGESTION_KAFKA_RAW_TOPIC: transport-telemetry-raw
      INGESTION_KAFKA_DLQ_TOPIC: transport-telemetry-dlq
      INGESTION_KAFKA_TRIP_LIFECYCLE_TOPIC: trip.lifecycle
      INGESTION_SERVICE_PORT: 8001
      INGESTION_MIN_MESSAGE_INTERVAL_SECONDS: 3.0
      INGESTION_DUPLICATE_CACHE_SIZE: 100
      INGESTION_TRIP_CACHE_REBUILD_TIMEOUT_SECONDS: 2.0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mqtt-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
