name: Crowd Sensing Service CI

on:
  pull_request:
    paths:
      - "services/crowd-sensing/**"
      - ".github/workflows/test_crowd_sensing.yml"

jobs:
  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/crowd-sensing

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests -v

      - name: Run BDD tests
        run: behave
