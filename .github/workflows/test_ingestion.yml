name: Ingestion Service CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'services/ingestion/**'
      - '.github/workflows/test_ingestion.yml'
      - 'schemas/**'
      - 'docker/**'

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Ingestion Dockerfile uses 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ingestion/requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          python -m pytest services/ingestion/tests/unit -v \
          --cov=services/ingestion/app \
          --cov-report=term-missing

  integration-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ingestion/requirements-dev.txt

      - name: Run ingestion smoke test
        run: |
          python -m pytest services/ingestion/tests/integration -m integration -v
