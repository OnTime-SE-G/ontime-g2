name: Build and Publish to GHCR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile
          - service: fleet-management-service
            context: .
            dockerfile: services/fleet-management-service/Dockerfile
          - service: ingestion
            context: .
            dockerfile: services/ingestion/Dockerfile
          - service: stream-processing
            context: .
            dockerfile: services/stream-processing/Dockerfile
          - service: route-service
            context: services/route-service
            dockerfile: services/route-service/Dockerfile
          - service: websocket-service
            context: services/websocket-service
            dockerfile: services/websocket-service/Dockerfile
          - service: anomaly-service
            context: .
            dockerfile: services/anomaly-service/Dockerfile
          - service: eta-service
            context: .
            dockerfile: services/eta-service/Dockerfile
          - service: crowd-sensing
            context: .
            dockerfile: services/crowd-sensing/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
    steps:
      - name: Set up kubectl
        if: ${{ env.KUBE_CONFIG_B64 != '' }}
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.29.0"

      - name: Install doctl
        if: ${{ env.KUBE_CONFIG_B64 != '' }}
        run: |
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.104.0/doctl-1.104.0-linux-amd64.tar.gz | tar xz
          sudo mv doctl /usr/local/bin/doctl
          doctl auth init --access-token ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Configure kubeconfig
        if: ${{ env.KUBE_CONFIG_B64 != '' }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_B64" | base64 -d > ~/.kube/config

      - name: Deploy to Kubernetes
        if: ${{ env.KUBE_CONFIG_B64 != '' }}
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          sha="${{ github.sha }}"
          kubectl set image deployment/transit-platform-g2-api-gateway \
            api-gateway="ghcr.io/${repo}/api-gateway:sha-${sha:0:7}" \
            -n transit-platform
          kubectl set image deployment/transit-platform-g2-websocket-service \
            websocket-service="ghcr.io/${repo}/websocket-service:sha-${sha:0:7}" \
            -n transit-platform
          kubectl set image deployment/transit-platform-g2-fleet-management-service \
            fleet-management-service="ghcr.io/${repo}/fleet-management-service:sha-${sha:0:7}" \
            -n transit-platform
          kubectl set image deployment/transit-platform-g2-route-service \
            route-service="ghcr.io/${repo}/route-service:sha-${sha:0:7}" \
            -n transit-platform
          kubectl set image deployment/transit-platform-g2-ingestion \
            ingestion="ghcr.io/${repo}/ingestion:sha-${sha:0:7}" \
            -n transit-platform
          kubectl set image deployment/transit-platform-g2-stream-processing \
            stream-processing="ghcr.io/${repo}/stream-processing:sha-${sha:0:7}" \
            -n transit-platform
          kubectl set image deployment/transit-platform-g2-anomaly-service \
            anomaly-service="ghcr.io/${repo}/anomaly-service:sha-${sha:0:7}" \
            -n transit-platform
          kubectl set image deployment/transit-platform-g2-eta-service \
            eta-service="ghcr.io/${repo}/eta-service:sha-${sha:0:7}" \
            -n transit-platform
          kubectl set image deployment/transit-platform-g2-crowd-sensing \
            crowd-sensing="ghcr.io/${repo}/crowd-sensing:sha-${sha:0:7}" \
            -n transit-platform
          kubectl rollout status deployment/transit-platform-g2-api-gateway \
            -n transit-platform --timeout=120s
          kubectl rollout status deployment/transit-platform-g2-ingestion \
            -n transit-platform --timeout=120s
          kubectl rollout status deployment/transit-platform-g2-stream-processing \
            -n transit-platform --timeout=120s
          kubectl rollout status deployment/transit-platform-g2-anomaly-service \
            -n transit-platform --timeout=120s
          kubectl rollout status deployment/transit-platform-g2-eta-service \
            -n transit-platform --timeout=300s
          kubectl rollout status deployment/transit-platform-g2-crowd-sensing \
            -n transit-platform --timeout=120s

      - name: Skip deploy (missing kubeconfig)
        if: ${{ env.KUBE_CONFIG_B64 == '' }}
        run: echo "Deploy skipped — add KUBE_CONFIG_B64 as a repository variable to enable."
