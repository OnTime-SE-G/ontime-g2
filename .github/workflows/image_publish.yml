name: Build and Publish to DigitalOcean

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # Replace <your-registry-name> with your actual DigitalOcean registry name
  REGISTRY: registry.digitalocean.com/ontime-registry
  IMAGE_NAME_PREFIX: ontime

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: .
            dockerfile: services/api-gateway/Dockerfile
          - service: fleet-management-service
            context: .
            dockerfile: services/fleet-management-service/Dockerfile
          - service: ingestion
            context: .
            dockerfile: services/ingestion/Dockerfile
          - service: stream-processing
            context: .
            dockerfile: services/stream-processing/Dockerfile
          - service: route-service
            context: services/route-service
            dockerfile: services/route-service/Dockerfile
          - service: websocket-service
            context: services/websocket-service
            dockerfile: services/websocket-service/Dockerfile
          - service: anomaly-service
            context: services/anomaly-service
            dockerfile: services/anomaly-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Log in to DigitalOcean Container Registry
      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          # You can use any string for username; the password (token) is what matters
          username: do
          password: ${{ secrets.DO_ACCESS_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
