# .github/workflows/ci.yml

name: Python CI

on:
  pull_request:
    paths:
      - "scripts/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transport
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d transport"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/transport
      KML_FILE: data/moratuwa_kadawatha.kml

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          python -m pytest tests -v --cov=scripts --cov-report=term-missing