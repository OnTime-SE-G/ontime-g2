# Mosquitto MQTT Broker Configuration
# Used by G2 Ingestion Service and G1 GPS devices

# Default MQTT listener
listener 1883
allow_anonymous true

# WebSocket listener (useful for browser-based MQTT debugging tools)
listener 9001
protocol websockets

# Logging
log_dest stdout
log_type all

# Persistence
persistence true
persistence_location /mosquitto/data/
