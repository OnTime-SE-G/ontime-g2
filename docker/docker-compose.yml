services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ontime_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ontime_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - ontime_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d
            ${POSTGRES_DB:-ontime_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ontime_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@ontime.lk"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "5050:80"
    networks:
      - ontime_network
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: ontime_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - ontime_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2
    container_name: ontime_influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: ${INFLUXDB_INIT_MODE:-setup}
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:-adminpassword}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG:-ontime}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:-super_secret_admin_token_123}
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - ontime_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8086/ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: ontime_api_gateway
    ports:
      - "8000:8000"
    volumes:
      - ../services/api-gateway:/app
    environment:
      API_GATEWAY_SERVICE_PORT: ${API_GATEWAY_SERVICE_PORT:-8000}
      API_GATEWAY_ROUTE_SERVICE_URL: ${API_GATEWAY_ROUTE_SERVICE_URL:-http://route-service:8002}
      API_GATEWAY_FLEET_SERVICE_URL: ${API_GATEWAY_FLEET_SERVICE_URL:-http://fleet-management-service:8003}
      API_GATEWAY_REDIS_URL: ${API_GATEWAY_REDIS_URL:-redis://redis:6379/0}
      API_GATEWAY_POSTGRES_HOST: ${API_GATEWAY_POSTGRES_HOST:-postgres}
      API_GATEWAY_POSTGRES_PORT: ${API_GATEWAY_POSTGRES_PORT:-5432}
      API_GATEWAY_REDIS_HOST: ${API_GATEWAY_REDIS_HOST:-redis}
      API_GATEWAY_REDIS_PORT: ${API_GATEWAY_REDIS_PORT:-6379}
      API_GATEWAY_KAFKA_HOST: ${API_GATEWAY_KAFKA_HOST:-broker}
      API_GATEWAY_KAFKA_PORT: ${API_GATEWAY_KAFKA_PORT:-29092}
      API_GATEWAY_INFLUXDB_HOST: ${API_GATEWAY_INFLUXDB_HOST:-influxdb}
      API_GATEWAY_INFLUXDB_PORT: ${API_GATEWAY_INFLUXDB_PORT:-8086}
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: ontime
      KEYCLOAK_CLIENT_ID: ontime-api
      KEYCLOAK_CLIENT_SECRET: secret
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    networks:
      - ontime_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  route-service:
    build:
      context: ../services/route-service
      dockerfile: Dockerfile
    container_name: ontime_route_service
    ports:
      - "8002:8002"
    volumes:
      - ../services/route-service:/app
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port $${ROUTE_SERVICE_PORT:-8002} --reload"
    environment:
      ROUTE_SERVICE_PORT: ${ROUTE_SERVICE_PORT:-8002}
      ROUTE_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ontime_db}
    networks:
      - ontime_network
    depends_on:
      postgres:
        condition: service_healthy

  fleet-management-service:
    build:
      context: ..
      dockerfile: services/fleet-management-service/Dockerfile
    container_name: ontime_fleet_service
    ports:
      - "8003:8003"
    volumes:
      - ../services/fleet-management-service:/app
      - ../schemas:/app/schemas
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port $${FLEET_SERVICE_PORT:-8003} --reload"
    environment:
      FLEET_SERVICE_PORT: ${FLEET_SERVICE_PORT:-8003}
      FLEET_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/fleet_db
      FLEET_ROUTE_SERVICE_URL: ${FLEET_ROUTE_SERVICE_URL:-http://route-service:8002}
      FLEET_ROUTE_SERVICE_TIMEOUT_SECONDS: ${FLEET_ROUTE_SERVICE_TIMEOUT_SECONDS:-3.0}
      FLEET_KAFKA_BROKER_URL: ${FLEET_KAFKA_BROKER_URL:-broker:29092}
      FLEET_KAFKA_TRIP_LIFECYCLE_TOPIC: ${FLEET_KAFKA_TRIP_LIFECYCLE_TOPIC:-trip.lifecycle}
    networks:
      - ontime_network
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  broker:
    image: confluentinc/confluent-local:7.5.0
    container_name: ontime_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
    networks:
      - ontime_network
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-init:
    image: confluentinc/confluent-local:7.5.0
    container_name: ontime_kafka_init
    networks:
      - ontime_network
    depends_on:
      broker:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic trip.lifecycle --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic transport-telemetry-raw --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic transport-telemetry-dlq --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic transport-telemetry-cleaned --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic transport-anomaly-alerts --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server broker:29092 --create --if-not-exists --topic transport-eta-features --partitions 1 --replication-factor 1

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: ontime_mqtt
    ports:
      - "${MQTT_BROKER_PORT:-1883}:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - ontime_network
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_sub",
          "-t",
          "$$SYS/#",
          "-C",
          "1",
          "-i",
          "healthcheck",
          "-W",
          "3",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  ingestion-service:
    build:
      context: ..
      dockerfile: services/ingestion/Dockerfile
    container_name: ontime_ingestion
    ports:
      - "8001:8001"
    environment:
      INGESTION_MQTT_BROKER_HOST: ${INGESTION_MQTT_BROKER_HOST:-mqtt-broker}
      INGESTION_MQTT_BROKER_PORT: ${INGESTION_MQTT_BROKER_PORT:-1883}
      INGESTION_MQTT_TOPIC_PATTERN: ${INGESTION_MQTT_TOPIC_PATTERN:-transport/bus/+/location}
      INGESTION_MQTT_HEARTBEAT_TOPIC_PATTERN: ${INGESTION_MQTT_HEARTBEAT_TOPIC_PATTERN:-transport/bus/+/heartbeat}
      INGESTION_MQTT_TLS_ENABLED: ${INGESTION_MQTT_TLS_ENABLED:-false}
      INGESTION_MQTT_USERNAME: ${INGESTION_MQTT_USERNAME:-}
      INGESTION_MQTT_PASSWORD: ${INGESTION_MQTT_PASSWORD:-}
      INGESTION_MQTT_CLIENT_ID: ${INGESTION_MQTT_CLIENT_ID:-ontime-ingestion-service}
      INGESTION_MQTT_CA_CERT_PATH: ${INGESTION_MQTT_CA_CERT_PATH:-}
      INGESTION_KAFKA_BROKER_URL: ${INGESTION_KAFKA_BROKER_URL:-broker:29092}
      INGESTION_KAFKA_RAW_TOPIC: ${INGESTION_KAFKA_RAW_TOPIC:-transport-telemetry-raw}
      INGESTION_KAFKA_DLQ_TOPIC: ${INGESTION_KAFKA_DLQ_TOPIC:-transport-telemetry-dlq}
      INGESTION_KAFKA_TRIP_LIFECYCLE_TOPIC: ${INGESTION_KAFKA_TRIP_LIFECYCLE_TOPIC:-trip.lifecycle}
      INGESTION_TRIP_CACHE_CONSUMER_GROUP: ${INGESTION_TRIP_CACHE_CONSUMER_GROUP:-ingestion-trip-cache}
      INGESTION_REQUIRE_ACTIVE_TRIP: ${INGESTION_REQUIRE_ACTIVE_TRIP:-true}
      INGESTION_TRIP_CACHE_REBUILD_TIMEOUT_SECONDS: ${INGESTION_TRIP_CACHE_REBUILD_TIMEOUT_SECONDS:-60.0}
      INGESTION_STARTUP_BUFFER_MAX_MESSAGES: ${INGESTION_STARTUP_BUFFER_MAX_MESSAGES:-1000}
      INGESTION_SERVICE_PORT: ${INGESTION_SERVICE_PORT:-8001}
      INGESTION_MIN_MESSAGE_INTERVAL_SECONDS: ${INGESTION_MIN_MESSAGE_INTERVAL_SECONDS:-3.0}
      INGESTION_MIN_EVENT_INTERVAL_SECONDS: ${INGESTION_MIN_EVENT_INTERVAL_SECONDS:-1.0}
      INGESTION_MAX_FUTURE_SKEW_SECONDS: ${INGESTION_MAX_FUTURE_SKEW_SECONDS:-30.0}
      INGESTION_MAX_STALE_AGE_SECONDS: ${INGESTION_MAX_STALE_AGE_SECONDS:-86400.0}
      INGESTION_DUPLICATE_CACHE_SIZE: ${INGESTION_DUPLICATE_CACHE_SIZE:-100}
    networks:
      - ontime_network
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mqtt-broker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;
            urllib.request.urlopen('http://127.0.0.1:8001/health/ready',
            timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
      
  websocket-service:
    build:
      context: ../services/websocket-service
      dockerfile: Dockerfile
    container_name: ontime_websocket_service
    ports:
      - "8004:8004"
    volumes:
      - ../services/websocket-service:/app
    environment:
      WEBSOCKET_SERVICE_PORT: ${WEBSOCKET_SERVICE_PORT:-8004}
      WEBSOCKET_REDIS_URL: ${WEBSOCKET_REDIS_URL:-redis://redis:6379}
      WEBSOCKET_FLEET_CHANNEL: ${WEBSOCKET_FLEET_CHANNEL:-fleet:live}
      WEBSOCKET_ETA_CHANNEL: ${WEBSOCKET_ETA_CHANNEL:-eta:live}
    networks:
      - ontime_network
    depends_on:
      redis:
        condition: service_healthy

  flink-jobmanager:
    build:
      context: ..
      dockerfile: services/stream-processing/Dockerfile
    container_name: ontime_flink_jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
      STREAM_KAFKA_BROKER_URL: ${STREAM_KAFKA_BROKER_URL:-broker:29092}
      STREAM_KAFKA_RAW_TOPIC: ${STREAM_KAFKA_RAW_TOPIC:-transport-telemetry-raw}
      STREAM_KAFKA_CLEANED_TOPIC: ${STREAM_KAFKA_CLEANED_TOPIC:-transport-telemetry-cleaned}
      STREAM_KAFKA_LIFECYCLE_TOPIC: ${STREAM_KAFKA_LIFECYCLE_TOPIC:-trip.lifecycle}
      STREAM_KAFKA_CONSUMER_GROUP: ${STREAM_KAFKA_CONSUMER_GROUP:-stream-processing-group}
      STREAM_KAFKA_LIFECYCLE_CONSUMER_GROUP: ${STREAM_KAFKA_LIFECYCLE_CONSUMER_GROUP:-stream-processing-lifecycle-group}
      STREAM_REDIS_HOST: ${STREAM_REDIS_HOST:-redis}
      STREAM_REDIS_PORT: ${STREAM_REDIS_PORT:-6379}
      STREAM_REDIS_FLEET_LIVE_CHANNEL: ${STREAM_REDIS_FLEET_LIVE_CHANNEL:-fleet:live}
      STREAM_INFLUXDB_URL: ${STREAM_INFLUXDB_URL:-http://influxdb:8086}
      STREAM_INFLUXDB_TOKEN: ${STREAM_INFLUXDB_TOKEN:-super_secret_admin_token_123}
      STREAM_INFLUXDB_ORG: ${STREAM_INFLUXDB_ORG:-ontime}
      STREAM_INFLUXDB_BUCKET: ${STREAM_INFLUXDB_BUCKET:-telemetry}
      STREAM_ROUTE_SERVICE_URL: ${STREAM_ROUTE_SERVICE_URL:-http://route-service:8002}
      STREAM_FLINK_PARALLELISM: ${STREAM_FLINK_PARALLELISM:-1}
      PYTHONPATH: /opt/flink/usrlib
    networks:
      - ontime_network
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  flink-taskmanager:
    build:
      context: ..
      dockerfile: services/stream-processing/Dockerfile
    container_name: ontime_flink_taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_started
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
      STREAM_KAFKA_BROKER_URL: ${STREAM_KAFKA_BROKER_URL:-broker:29092}
      STREAM_KAFKA_RAW_TOPIC: ${STREAM_KAFKA_RAW_TOPIC:-transport-telemetry-raw}
      STREAM_KAFKA_CLEANED_TOPIC: ${STREAM_KAFKA_CLEANED_TOPIC:-transport-telemetry-cleaned}
      STREAM_KAFKA_LIFECYCLE_TOPIC: ${STREAM_KAFKA_LIFECYCLE_TOPIC:-trip.lifecycle}
      STREAM_KAFKA_CONSUMER_GROUP: ${STREAM_KAFKA_CONSUMER_GROUP:-stream-processing-group}
      STREAM_KAFKA_LIFECYCLE_CONSUMER_GROUP: ${STREAM_KAFKA_LIFECYCLE_CONSUMER_GROUP:-stream-processing-lifecycle-group}
      STREAM_REDIS_HOST: ${STREAM_REDIS_HOST:-redis}
      STREAM_REDIS_PORT: ${STREAM_REDIS_PORT:-6379}
      STREAM_REDIS_FLEET_LIVE_CHANNEL: ${STREAM_REDIS_FLEET_LIVE_CHANNEL:-fleet:live}
      STREAM_INFLUXDB_URL: ${STREAM_INFLUXDB_URL:-http://influxdb:8086}
      STREAM_INFLUXDB_TOKEN: ${STREAM_INFLUXDB_TOKEN:-super_secret_admin_token_123}
      STREAM_INFLUXDB_ORG: ${STREAM_INFLUXDB_ORG:-ontime}
      STREAM_INFLUXDB_BUCKET: ${STREAM_INFLUXDB_BUCKET:-telemetry}
      STREAM_ROUTE_SERVICE_URL: ${STREAM_ROUTE_SERVICE_URL:-http://route-service:8002}
      STREAM_FLINK_PARALLELISM: ${STREAM_FLINK_PARALLELISM:-1}
      PYTHONPATH: /opt/flink/usrlib
    networks:
      - ontime_network

  flink-job-submitter:
    build:
      context: ..
      dockerfile: services/stream-processing/Dockerfile
    container_name: ontime_flink_job_submitter
    command: >
      bash -c '
        for attempt in $$(seq 1 30); do
          if flink list -m flink-jobmanager:8081 >/dev/null 2>&1; then
            echo "Flink JobManager is ready; submitting telemetry job"
            flink run -m flink-jobmanager:8081 -py /opt/flink/usrlib/app/job.py
            exit $$?
          fi
          echo "Waiting for Flink JobManager ($${attempt}/30)..."
          sleep 5
        done
        echo "Flink JobManager was not ready after 150 seconds"
        exit 1
      '
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
      STREAM_KAFKA_BROKER_URL: ${STREAM_KAFKA_BROKER_URL:-broker:29092}
      STREAM_KAFKA_RAW_TOPIC: ${STREAM_KAFKA_RAW_TOPIC:-transport-telemetry-raw}
      STREAM_KAFKA_CLEANED_TOPIC: ${STREAM_KAFKA_CLEANED_TOPIC:-transport-telemetry-cleaned}
      STREAM_KAFKA_LIFECYCLE_TOPIC: ${STREAM_KAFKA_LIFECYCLE_TOPIC:-trip.lifecycle}
      STREAM_KAFKA_CONSUMER_GROUP: ${STREAM_KAFKA_CONSUMER_GROUP:-stream-processing-group}
      STREAM_KAFKA_LIFECYCLE_CONSUMER_GROUP: ${STREAM_KAFKA_LIFECYCLE_CONSUMER_GROUP:-stream-processing-lifecycle-group}
      STREAM_REDIS_HOST: ${STREAM_REDIS_HOST:-redis}
      STREAM_REDIS_PORT: ${STREAM_REDIS_PORT:-6379}
      STREAM_REDIS_FLEET_LIVE_CHANNEL: ${STREAM_REDIS_FLEET_LIVE_CHANNEL:-fleet:live}
      STREAM_INFLUXDB_URL: ${STREAM_INFLUXDB_URL:-http://influxdb:8086}
      STREAM_INFLUXDB_TOKEN: ${STREAM_INFLUXDB_TOKEN:-super_secret_admin_token_123}
      STREAM_INFLUXDB_ORG: ${STREAM_INFLUXDB_ORG:-ontime}
      STREAM_INFLUXDB_BUCKET: ${STREAM_INFLUXDB_BUCKET:-telemetry}
      STREAM_ROUTE_SERVICE_URL: ${STREAM_ROUTE_SERVICE_URL:-http://route-service:8002}
      STREAM_FLINK_PARALLELISM: ${STREAM_FLINK_PARALLELISM:-1}
      PYTHONPATH: /opt/flink/usrlib
    networks:
      - ontime_network
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started

  eta-service:
    build:
      context: ../services/eta-service
      dockerfile: Dockerfile
    container_name: ontime_eta_service
    ports:
      - "8005:8005"
    environment:
      ETA_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/eta_db
      ETA_KAFKA_BROKER_URL: ${ETA_KAFKA_BROKER_URL:-broker:29092}
      ETA_KAFKA_TOPIC: ${ETA_KAFKA_TOPIC:-transport-eta-features}
      ETA_KAFKA_CONSUMER_GROUP: ${ETA_KAFKA_CONSUMER_GROUP:-eta-service-group}
      ETA_REDIS_HOST: ${ETA_REDIS_HOST:-redis}
      ETA_REDIS_PORT: ${ETA_REDIS_PORT:-6379}
      ETA_SERVICE_PORT: ${ETA_SERVICE_PORT:-8005}
      ETA_SARIMA_MIN_HOURS: ${ETA_SARIMA_MIN_HOURS:-48}
      ETA_RECORDS_RETENTION_MONTHS: ${ETA_RECORDS_RETENTION_MONTHS:-6}
    networks:
      - ontime_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  anomaly-service:
    build:
      context: ../services/anomaly-service
      dockerfile: Dockerfile
    container_name: ontime_anomaly_service
    ports:
      - "8006:8006"
    environment:
      ANOMALY_SERVICE_PORT: ${ANOMALY_SERVICE_PORT:-8006}
      ANOMALY_KAFKA_BROKER_URL: ${ANOMALY_KAFKA_BROKER_URL:-broker:29092}
      ANOMALY_KAFKA_CLEANED_TOPIC: ${ANOMALY_KAFKA_CLEANED_TOPIC:-transport-telemetry-cleaned}
      ANOMALY_KAFKA_DLQ_TOPIC: ${ANOMALY_KAFKA_DLQ_TOPIC:-transport-telemetry-dlq}
      ANOMALY_KAFKA_ALERTS_TOPIC: ${ANOMALY_KAFKA_ALERTS_TOPIC:-transport-anomaly-alerts}
      ANOMALY_KAFKA_CLEANED_GROUP_ID: ${ANOMALY_KAFKA_CLEANED_GROUP_ID:-anomaly-service-group}
      ANOMALY_KAFKA_DLQ_GROUP_ID: ${ANOMALY_KAFKA_DLQ_GROUP_ID:-anomaly-service-dlq-group}
      ANOMALY_ROUTE_SERVICE_URL: ${ANOMALY_ROUTE_SERVICE_URL:-http://route-service:8002}
      ANOMALY_ROUTE_FETCH_TIMEOUT_SECONDS: ${ANOMALY_ROUTE_FETCH_TIMEOUT_SECONDS:-10.0}
      ANOMALY_ROUTE_REFRESH_INTERVAL_SECONDS: ${ANOMALY_ROUTE_REFRESH_INTERVAL_SECONDS:-300}
      ANOMALY_COMMUNICATION_LOSS_CHECK_INTERVAL_SECONDS: ${ANOMALY_COMMUNICATION_LOSS_CHECK_INTERVAL_SECONDS:-60}
      ANOMALY_COMMUNICATION_LOSS_THRESHOLD_SECONDS: ${ANOMALY_COMMUNICATION_LOSS_THRESHOLD_SECONDS:-180}
      ANOMALY_INACTIVE_TRIP_DLQ_THRESHOLD_COUNT: ${ANOMALY_INACTIVE_TRIP_DLQ_THRESHOLD_COUNT:-3}
      ANOMALY_INACTIVE_TRIP_DLQ_WINDOW_SECONDS: ${ANOMALY_INACTIVE_TRIP_DLQ_WINDOW_SECONDS:-60}
      ANOMALY_INACTIVE_TRIP_DLQ_COOLDOWN_SECONDS: ${ANOMALY_INACTIVE_TRIP_DLQ_COOLDOWN_SECONDS:-300}
    networks:
      - ontime_network
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      route-service:
        condition: service_started

networks:
  ontime_network:
    driver: bridge

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
  mosquitto_data:
  mosquitto_log:
