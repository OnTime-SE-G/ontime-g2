services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ontime_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ontime_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - ontime_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d
            ${POSTGRES_DB:-ontime_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ontime_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@ontime.lk"
      PGADMIN_DEFAULT_PASSWORD: "admin"
    ports:
      - "5050:80"
    networks:
      - ontime_network
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: ontime_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - ontime_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2
    container_name: ontime_influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: ${INFLUXDB_INIT_MODE:-setup}
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:-adminpassword}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG:-ontime}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:-super_secret_admin_token_123}
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - ontime_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8086/ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: ontime_api_gateway
    ports:
      - "8000:8000"
    volumes:
      - ../services/api-gateway:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ontime_db}
      - REDIS_URL=redis://redis:6379
    networks:
      - ontime_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  route-service:
    build:
      context: ../services/route-service
      dockerfile: Dockerfile
    container_name: ontime_route_service
    ports:
      - "8002:8002"
    volumes:
      - ./services/route-service:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/route_db
    networks:
      - ontime_network
    depends_on:
      postgres:
        condition: service_healthy

  bus-service:
    build:
      context: ../services/bus-service
      dockerfile: Dockerfile
    container_name: ontime_bus_service
    ports:
      - "8003:8003"
    volumes:
      - ../services/bus-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/bus_db
    networks:
      - ontime_network
    depends_on:
      postgres:
        condition: service_healthy

  broker:
    image: confluentinc/confluent-local:7.5.0
    container_name: ontime_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
    networks:
      - ontime_network
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: ontime_mqtt
    ports:
      - "${MQTT_BROKER_PORT:-1883}:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - ontime_network
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_sub",
          "-t",
          "$$SYS/#",
          "-C",
          "1",
          "-i",
          "healthcheck",
          "-W",
          "3",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  ontime_network:
    driver: bridge

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
  mosquitto_data:
  mosquitto_log:
