version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: chamodh-postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transport
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: chamodh-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@exammple.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
